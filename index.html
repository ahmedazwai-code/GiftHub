<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GiftHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
    }

    header {
      background: #000;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 40px 20px;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #555;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
      gap: 20px;
    }

    .card {
      background: white;
      width: 260px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
      text-align: center;
    }

    .card h2 {
      font-size: 18px;
      margin: 10px 0;
    }

    .card p {
      color: #777;
      font-size: 14px;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: black;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  🎁 GiftHub
</header>

<section class="hero">
  <h1>Best Gifts for Teens in 2026</h1>
  <p>Trending, affordable and actually worth buying 🔥</p>
</section>

<div class="container">

  <div class="card">
    <img src="https://via.placeholder.com/300x200" alt="LED Lights">
    <div class="card-content">
      <h2>LED Lights</h2>
      <p>Upgrade your room instantly</p>
      <a href="#" class="btn">Buy Now</a>
    </div>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x200" alt="Mini Projector">
    <div class="card-content">
      <h2>Mini Projector</h2>
      <p>Turn your room into a cinema</p>
      <a href="#" class="btn">Buy Now</a>
    </div>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x200" alt="Gaming Headset">
    <div class="card-content">
      <h2>Gaming Headset</h2>
      <p>Perfect for PS5 & PC</p>
      <a href="#" class="btn">Buy Now</a>
    </div>
  </div>

</div>

<footer>
  © 2026 GiftHub
</footer>

</body>
</html>
